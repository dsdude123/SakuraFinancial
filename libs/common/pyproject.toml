[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakura-common"
version = "0.1.0"
description = "Shared library for SakuraFinancial services: money handling, CSV engine, dedup hashing, LLM client, Yahoo Finance client, settings client, export helpers."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["sakura_common*"]
