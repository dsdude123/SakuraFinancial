services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-sakura-super-dev}
      SETTINGS_DB_PASSWORD: ${SETTINGS_DB_PASSWORD:-sakura-settings-dev}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-sakura-ledger-dev}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:-sakura-budget-dev}
      STOCKS_DB_PASSWORD: ${STOCKS_DB_PASSWORD:-sakura-stocks-dev}
      RECEIPTS_DB_PASSWORD: ${RECEIPTS_DB_PASSWORD:-sakura-receipts-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  settings:
    build:
      context: .
      dockerfile: services/settings/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sakura_settings:${SETTINGS_DB_PASSWORD:-sakura-settings-dev}@db:5432/sakura_settings
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8005/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  ledger:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sakura_ledger:${LEDGER_DB_PASSWORD:-sakura-ledger-dev}@db:5432/sakura_ledger
      SETTINGS_URL: http://settings:8005
      RECEIPTS_URL: http://receipts:8004
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  budget:
    build:
      context: .
      dockerfile: services/budget/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sakura_budget:${BUDGET_DB_PASSWORD:-sakura-budget-dev}@db:5432/sakura_budget
      LEDGER_URL: http://ledger:8001
      SETTINGS_URL: http://settings:8005
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  stocks:
    build:
      context: .
      dockerfile: services/stocks/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sakura_stocks:${STOCKS_DB_PASSWORD:-sakura-stocks-dev}@db:5432/sakura_stocks
      SETTINGS_URL: http://settings:8005
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  receipts:
    build:
      context: .
      dockerfile: services/receipts/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sakura_receipts:${RECEIPTS_DB_PASSWORD:-sakura-receipts-dev}@db:5432/sakura_receipts
      SETTINGS_URL: http://settings:8005
      LEDGER_URL: http://ledger:8001
      RECEIPTS_DATA_DIR: /data/receipts
    volumes:
      - receipts_data:/data/receipts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  webui:
    build:
      context: .
      dockerfile: services/web-ui/Dockerfile
    environment:
      SECRET_KEY: ${WEBUI_SECRET_KEY:-sakura-webui-dev-secret}
      SETTINGS_URL: http://settings:8005
      LEDGER_URL: http://ledger:8001
      BUDGET_URL: http://budget:8002
      STOCKS_URL: http://stocks:8003
      RECEIPTS_URL: http://receipts:8004
    ports:
      - "${WEBUI_PORT:-8000}:8000"
    depends_on:
      - settings
      - ledger
      - budget
      - stocks
      - receipts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  receipts_data:
